# Deploys every merge to main (WU-21, WU-23b; ADR 0005). One pipeline, no human step:
#
#   build ──► twin-check ──┐
#   journeys ──────────────┴──► promote (environment `live`) ──► smoke ──► rollback on failure
#
# - build: builds the API and web images and pushes them. The web image is built with `api`'s URL,
#   which Next inlines into the bundle (ADR 0005 §8).
# - twin-check: deploys the API image to the replay twin (`api-replay`, infra/replay.tf) and runs the
#   provider contract suite against it, with a Google ID token rather than a stored code (WU-23a plan
#   D4). The twin always replays, so no merge ever calls the model (WU-23b plan D4).
# - journeys: `pnpm verify:integrated` (replay), with no cloud access.
# - promote: deploys exactly the digests build pushed to `api`, then `web`, runs a model-free smoke
#   check, and on any failure redeploys the images that were running before (WU-23b plan D6).
#
# Two identities through GitHub OIDC and Workload Identity Federation, no stored key. build and
# twin-check run as the build identity, which can't deploy `api` or `web`. Only the promote job, in
# the environment `live`, gets the promote identity, and it installs and builds nothing, so no
# third-party package runs where it could deploy as the account that reads the API key (WU-23b plan
# D7; infra/deploy-identity.tf). Each job deploys only images; everything else is Terraform's.
#
# The repository is public, so its Actions logs are too. The service URLs and the environment's
# identifiers aren't credentials, but they aren't advertised. So the identifiers are Actions secrets,
# which GitHub masks in every log line, and the values derived from them (the project number, the
# URLs) are masked in each job before anything can print them (WU-21 plan D5, D6; deviation 4). Job
# outputs carry only image digests, which hold no identifier.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a commit on main to rebuild and redeploy (empty = the tip of main)
        required: false
        default: ''

permissions:
  contents: read

# A deploy is never cut off half way; a later merge waits for the one in flight, so promotions land
# in merge order.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.push.outputs.api_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - name: Mask the project number
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          PROMOTE_SA: ${{ secrets.GCP_PROMOTE_SA }}
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ] || [ -z "$PROMOTE_SA" ]; then
            echo "::error::Set the GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA and GCP_PROMOTE_SA repository secrets (infra/README.md)."
            exit 1
          fi
          # The provider's name is projects/<number>/locations/global/..., and the number is also
          # part of every run.app URL. GitHub masks the secrets themselves, not values derived
          # from them.
          number="${WIF_PROVIDER#projects/}"
          number="${number%%/*}"
          echo "::add-mask::$number"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # A dispatch may name an older commit: a full SHA (every job checks out exactly that commit,
      # and the images are tagged with it), and on main. A push needs no check: the identity
      # condition admits only main (and a scratch ref while one is being proved).
      - name: Check the commit is on main
        if: inputs.sha != ''
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi

      # Both images build inside Docker, so no dependency install runs on the runner, where the
      # credential below lives.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Read the API's URL
        run: |
          url="$(gcloud run services describe api --region "$REGION" --format='value(status.url)')"
          if [ -z "$url" ]; then
            echo "::error::Could not read the API's URL."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "::add-mask::${url#https://}"
          echo "API_URL=$url" >>"$GITHUB_ENV"

      - id: push
        name: Build and push the images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          registry="$REGION-docker.pkg.dev/$PROJECT_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -f backends/api-nextjs/Dockerfile -t "$registry/api/api-nextjs:$SHA" .
          docker build --platform linux/amd64 -f apps/web-nextjs/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$API_URL" -t "$registry/web/web-nextjs:$SHA" .
          docker push "$registry/api/api-nextjs:$SHA"
          docker push "$registry/web/web-nextjs:$SHA"
          # Only the digests leave this job: what was pushed is exactly what later jobs deploy.
          digest() { docker inspect --format '{{index .RepoDigests 0}}' "$1" | sed 's/.*@//'; }
          echo "api_digest=$(digest "$registry/api/api-nextjs:$SHA")" >>"$GITHUB_OUTPUT"
          echo "web_digest=$(digest "$registry/web/web-nextjs:$SHA")" >>"$GITHUB_OUTPUT"

  twin-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the project number
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="${WIF_PROVIDER#projects/}"
          number="${number%%/*}"
          echo "::add-mask::$number"

      # Dependencies are installed before any cloud credential exists in the job, so no install
      # script can reach one (WU-21 plan review #6).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Read the URL and WEB_ORIGIN, and mask the URL, before the deploy, whose output prints it.
      - name: Read the twin's URL and WEB_ORIGIN
        run: |
          service_json="$(gcloud run services describe api-replay --region "$REGION" --format=json)"
          url="$(jq -r '.status.url' <<<"$service_json")"
          origin="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "WEB_ORIGIN") | .value' <<<"$service_json")"
          if [ -z "$url" ] || [ "$url" = null ] || [ -z "$origin" ]; then
            echo "::error::Could not read the twin's URL or its WEB_ORIGIN."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "::add-mask::${url#https://}"
          echo "::add-mask::$origin"
          echo "::add-mask::${origin#https://}"
          {
            echo "API_BASE_URL=$url"
            echo "WEB_ORIGIN=$origin"
          } >>"$GITHUB_ENV"

      # Only the image changes. Waits until the new revision is ready and serving.
      - name: Deploy the API image to the twin
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
        run: |
          gcloud run services update api-replay --region "$REGION" --quiet \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/api/api-nextjs@$API_DIGEST"

      # A Google ID token of the build identity, for the twin's access gate (WU-23a plan D4). It lives
      # an hour, works only for this audience, and the gate accepts it only for this account's email
      # (TRUSTED_SERVICE_ACCOUNTS in infra/replay.tf). The action masks it in the log. It writes no
      # credentials file and exports nothing, so it adds no cloud credential to the job.
      - id: contract-token
        name: Mint an ID token for the contract tests
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ai-trip-planner-api
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      # The contract suite runs with no cloud credential reachable: the credential file variables,
      # gcloud's config and the OIDC token request variables are all withheld. The runner sends
      # CONTRACT_INVITE_CODE as the Bearer value, here the ID token.
      - name: Provider contract tests against the service
        env:
          CONTRACT_INVITE_CODE: ${{ steps.contract-token.outputs.id_token }}
        run: |
          if [ -z "$CONTRACT_INVITE_CODE" ]; then
            echo "::error::The ID token step produced no token."
            exit 1
          fi
          env -u GOOGLE_APPLICATION_CREDENTIALS -u CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE \
            -u GOOGLE_GHA_CREDS_PATH -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            CLOUDSDK_CONFIG="$(mktemp -d)" pnpm test:contract:external

  # The integrated gate (CLAUDE.md §6.7), replay, against `next start` builds on the runner. No cloud
  # access: no id-token permission, no secret.
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version comes from @playwright/test, as in verify.yml.
      - run: pnpm --filter @vp/journeys exec playwright install --with-deps chromium
      - run: pnpm verify:integrated

  promote:
    needs: [build, twin-check, journeys]
    runs-on: ubuntu-latest
    # Room for a deploy, the smoke check and a full rollback, each with its own step timeout: a step
    # timeout is a failure, so the rollback still runs (a job timeout would cancel it).
    timeout-minutes: 30
    # Only a job in this environment can become the promote identity (infra/deploy-identity.tf). It
    # has no required reviewer: the checks above are the gate (WU-23b plan D6).
    environment: live
    permissions:
      contents: read
      id-token: write
    env:
      API_DIGEST: ${{ needs.build.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
    steps:
      - name: Mask the project number
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="${WIF_PROVIDER#projects/}"
          number="${number%%/*}"
          echo "::add-mask::$number"

      # Only for the smoke check, which uses Node built-ins alone: no dependency is installed in this
      # job, so no third-party package runs next to the promote identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROMOTE_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The URLs, masked before any deploy prints them, and the images running now, for a rollback.
      - name: Read the services and record what is running
        run: |
          api_json="$(gcloud run services describe api --region "$REGION" --format=json)"
          web_json="$(gcloud run services describe web --region "$REGION" --format=json)"
          api_url="$(jq -r '.status.url' <<<"$api_json")"
          web_url="$(jq -r '.status.url' <<<"$web_json")"
          origin="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "WEB_ORIGIN") | .value' <<<"$api_json")"
          for value in "$api_url" "$web_url" "$origin"; do
            if [ -z "$value" ] || [ "$value" = null ]; then
              echo "::error::Could not read the services' URLs or the API's WEB_ORIGIN."
              exit 1
            fi
            echo "::add-mask::$value"
            echo "::add-mask::${value#https://}"
          done
          prev_api="$(jq -r '.spec.template.spec.containers[0].image' <<<"$api_json")"
          prev_web="$(jq -r '.spec.template.spec.containers[0].image' <<<"$web_json")"
          # The image references contain the project ID, which GitHub masks; the digests are logged.
          echo "Running before this promotion: api ${prev_api##*@}, web ${prev_web##*@}"
          {
            echo "API_BASE_URL=$api_url"
            echo "WEB_BASE_URL=$web_url"
            echo "WEB_ORIGIN=$origin"
            echo "PREV_API_IMAGE=$prev_api"
            echo "PREV_WEB_IMAGE=$prev_web"
          } >>"$GITHUB_ENV"

      # The API first: a web image never points at an older API than it was built against.
      - name: Deploy the API and the web client
        timeout-minutes: 8
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "Promoting: api $API_DIGEST, web $WEB_DIGEST"
          gcloud run services update api --region "$REGION" --quiet \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/api/api-nextjs@$API_DIGEST"
          gcloud run services update web --region "$REGION" --quiet \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/web/web-nextjs@$WEB_DIGEST"

      # Model-free and credential-free, so it holds in live mode too (scripts/release-smoke.ts).
      - name: Smoke check
        timeout-minutes: 3
        run: node scripts/release-smoke.ts

      # Any failure or cancel after the images were recorded puts both services back on them. The run
      # still fails, so the merge shows red.
      - name: Roll back to the images that were running
        if: (failure() || cancelled()) && env.PREV_API_IMAGE != '' && env.PREV_WEB_IMAGE != ''
        timeout-minutes: 12
        run: |
          echo "::error::Promotion failed; rolling back to api ${PREV_API_IMAGE##*@}, web ${PREV_WEB_IMAGE##*@}."
          gcloud run services update api --region "$REGION" --quiet --image "$PREV_API_IMAGE"
          gcloud run services update web --region "$REGION" --quiet --image "$PREV_WEB_IMAGE"
          node scripts/release-smoke.ts
